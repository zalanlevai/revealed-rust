# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "reveal-rust-driver-cli"
version = "0.0.0"
authors = ["Zalán Bálint Lévai"]
description = "Shared CLI definitions between reveal-rust-driver and cargo-reveal."
keywords = ["macros", "macro-expansion", "testing"]
categories = ["development-tools::testing", "development-tools::debugging", "development-tools::cargo-plugins", "security"]
repository = "https://github.com/zalanlevai/revealed-rust"
license = "Apache-2.0 OR MIT"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["cargo"] }
color-print = "0.3"
