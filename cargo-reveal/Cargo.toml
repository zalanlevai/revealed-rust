# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "cargo-reveal"
version = "0.0.0"
authors = ["Zalán Bálint Lévai"]
description = "Reveal the Rust code behind macro expansions, type and name resolution, and elision."
keywords = ["macros", "macro-expansion", "testing"]
categories = ["development-tools::testing", "development-tools::debugging", "development-tools::cargo-plugins", "security"]
repository = "https://github.com/zalanlevai/revealed-rust"
license = "Apache-2.0 OR MIT"
edition = "2024"

[package.metadata.rust-analyzer]
rustc_private = true

[dependencies]
